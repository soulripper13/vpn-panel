name: Signed release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build signed bundle
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.VPN_PANEL_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY"
          version="${GITHUB_REF_NAME#v}"
          archive="vpn-panel-v${version}.tar.gz"
          release_dir="$RUNNER_TEMP/vpn-panel-release"
          mkdir -p "$release_dir"
          tar --exclude-vcs --exclude='backend/node_modules' --exclude='frontend/node_modules' -czf "$release_dir/$archive" --transform="s,^,vpn-panel-v${version}/," .
          sha256=$(sha256sum "$release_dir/$archive" | awk '{print $1}')
          printf '{"algorithm":"ed25519","archive":"%s","sha256":"%s","version":"%s"}\n' "$archive" "$sha256" "$version" > "$release_dir/vpn-panel-v${version}.manifest.json"
          umask 077
          printf '%s' "$RELEASE_PRIVATE_KEY" > /tmp/release-key.pem
          openssl pkeyutl -sign -inkey /tmp/release-key.pem -in "$release_dir/vpn-panel-v${version}.manifest.json" -out "$release_dir/vpn-panel-v${version}.manifest.sig"
          rm -f /tmp/release-key.pem
          cp deploy/migrate-legacy-install.sh "$release_dir/migrate-legacy-install.sh"
          chmod 755 "$release_dir/migrate-legacy-install.sh"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/vpn-panel-release/vpn-panel-*
            ${{ runner.temp }}/vpn-panel-release/migrate-legacy-install.sh
