name: Signed release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build signed bundle
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.VPN_PANEL_RELEASE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="vpn-panel-v${version}.tar.gz"
          tar --exclude-vcs --exclude='backend/node_modules' --exclude='frontend/node_modules' -czf "$archive" --transform="s,^,vpn-panel-v${version}/," .
          sha256=$(sha256sum "$archive" | awk '{print $1}')
          printf '{"algorithm":"ed25519","archive":"%s","sha256":"%s","version":"%s"}\n' "$archive" "$sha256" "$version" > "vpn-panel-v${version}.manifest.json"
          printf '%s' "$RELEASE_PRIVATE_KEY" > /tmp/release-key.pem
          openssl pkeyutl -sign -inkey /tmp/release-key.pem -in "vpn-panel-v${version}.manifest.json" -out "vpn-panel-v${version}.manifest.sig"
          rm -f /tmp/release-key.pem
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vpn-panel-*.tar.gz
            vpn-panel-*.manifest.json
            vpn-panel-*.manifest.sig
